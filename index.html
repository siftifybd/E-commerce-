<!doctype html>
<html lang="bn" class="h-full bg-white antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BD SHOPS — Premium Online Shopping in Bangladesh</title>
    <meta name="description" content="BD SHOPS - Premium Bangladeshi Mobile-First E-Commerce Platform offering authentic Punjabi, Ator, Islamic products, lifestyle apparel, and fast delivery." />
    
    <!-- Ultra-fast Instant Settings Pre-Bootstrap: Applies site name, logo, favicon, and theme before browser finishes HTML render -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('bdshops_cached_settings');
          if (raw) {
            var s = JSON.parse(raw);
            if (s.siteName) {
              document.title = s.siteName + ' — ' + (s.siteName === 'BD STORE' || s.siteName === 'BD SHOPS' ? 'Premium Online Shopping in Bangladesh' : 'Online Shopping');
              var metaApple = document.querySelector('meta[name="apple-mobile-web-app-title"]');
              if (metaApple) metaApple.setAttribute('content', s.siteName);
            }
            if (s.favicon) {
              var iconLink = document.querySelector("link[rel*='icon']");
              if (iconLink) iconLink.href = s.favicon;
            }
            if (s.themeColor) {
              document.documentElement.style.setProperty('--primary-theme-color', s.themeColor);
              var metaTheme = document.querySelector('meta[name="theme-color"]');
              if (metaTheme) metaTheme.setAttribute('content', s.themeColor);
            }
            if (s.themeMode === 'dark' || (!s.themeMode && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
              document.documentElement.classList.add('dark');
            } else if (s.themeMode === 'light') {
              document.documentElement.classList.remove('dark');
            }
            if (s.language) {
              document.documentElement.setAttribute('lang', s.language);
            }
          }
        } catch (e) {
          /* fail gracefully */
        }
      })();
    </script>
    
    <!-- Theme & App Store Mobile Web Compliance -->
    <meta name="theme-color" content="#00BFA5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BD SHOPS" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Open Graph / Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BD SHOPS" />
    <meta property="og:title" content="BD SHOPS — Premium Online Shopping in Bangladesh" />
    <meta property="og:description" content="BD SHOPS - Premium Bangladeshi Mobile-First E-Commerce Platform offering authentic Punjabi, Ator, Islamic products, lifestyle apparel, and fast delivery." />
    <meta property="og:image" content="/bd_store_logo.png" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BD SHOPS — Premium Online Shopping in Bangladesh" />
    <meta name="twitter:description" content="BD SHOPS - Premium Bangladeshi Mobile-First E-Commerce Platform offering authentic Punjabi, Ator, Islamic products, lifestyle apparel, and fast delivery." />
    <meta name="twitter:image" content="/bd_store_logo.png" />

    <!-- Google Web Fonts: Plus Jakarta Sans & Hind Siliguri -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="min-h-full bg-[#F5F7F8] text-[#1E293B] font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
