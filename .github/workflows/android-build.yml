name: Android Build Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Verify Android Project Exists
        run: |
          if [ ! -d "android-app/android" ]; then
            echo "Error: Android project directory (android-app/android) is missing!"
            exit 1
          fi

      - name: Install Node Dependencies
        run: |
          npm install
          cd android-app && npm install

      - name: Copy google-services.json to Android Project
        run: |
          mkdir -p android-app/android/app
          if [ -f "public/assets/aistudio/google-services__1__81809dba.json" ]; then
            cp public/assets/aistudio/google-services__1__81809dba.json android-app/android/app/google-services.json
            echo "Successfully copied google-services.json to android-app/android/app/"
          else
            echo "google-services.json source not found!"
          fi

      - name: Build APK via Gradle
        working-directory: ./android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: black-zone-shops-android-apk
          path: |
            android-app/android/app/build/outputs/apk/release/*.apk
            android-app/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
