name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK (Alternative)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Node Dependencies
        run: |
          npm install
          if [ -d "android-app" ]; then
            cd android-app && npm install
          fi

      - name: Handle Firebase google-services.json
        run: |
          mkdir -p android-app/android/app
          if [ -f "google-services.json" ]; then
            cp google-services.json android-app/android/app/google-services.json
          elif [ -f "public/assets/aistudio/google-services__1__81809dba.json" ]; then
            cp public/assets/aistudio/google-services__1__81809dba.json android-app/android/app/google-services.json
          fi

      - name: Build APK via Gradle (if Android project exists)
        run: |
          if [ -f "android-app/android/gradlew" ]; then
            cd android-app/android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
          else
            echo "Android native project folder not pre-generated in repository. Node dependencies & Firebase configuration prepared successfully."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: black-zone-shops-apk
          path: |
            android-app/android/app/build/outputs/apk/release/*.apk
            android-app/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
