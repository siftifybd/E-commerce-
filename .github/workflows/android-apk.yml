name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK (Alternative)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Node Dependencies
        working-directory: ./android-app
        run: npm install

      - name: Generate Native Android Project (React Native CLI)
        working-directory: ./android-app
        run: |
          if [ ! -d "android" ]; then
            echo "Generating native android project directory..."
            npx @react-native-community/cli init TempProject --skip-install --yes
            cp -R TempProject/android ./android
            rm -rf TempProject
          fi

      - name: Handle Firebase google-services.json
        run: |
          mkdir -p android-app/android/app
          if [ -f "google-services.json" ]; then
            cp google-services.json android-app/android/app/google-services.json
          elif [ -f "public/assets/aistudio/google-services__1__81809dba.json" ]; then
            cp public/assets/aistudio/google-services__1__81809dba.json android-app/android/app/google-services.json
          fi

      - name: Build APK via Gradle
        working-directory: ./android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: black-zone-shops-apk
          path: |
            android-app/android/app/build/outputs/apk/release/*.apk
            android-app/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
